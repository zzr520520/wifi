name: WiFiTool
options:
  bundleIdPrefix: com.wifitool
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    SWIFT_OBJC_BRIDGING_HEADER: "WiFiTool/Sources/WiFiTool-Bridging-Header.h"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    OBJECT_VERSION: "55"
    COMPATIBILITY_VERSION: "Xcode 14.0"
targets:
  WiFiTool:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: WiFiTool
        excludes:
          - "**/.DS_Store"
    dependencies:
      - sdk: CoreLocation.framework
      - sdk: NetworkExtension.framework
    info:
      path: WiFiTool/Info.plist
      properties:
        CFBundleDisplayName: WiFiTool
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: "需要获取位置权限以扫描周边 Wi-Fi 设备"
        NSLocationAlwaysAndWhenInUseUsageDescription: "需要获取位置权限以扫描周边 Wi-Fi 设备"
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wifitool.app
        SWIFT_OBJC_BRIDGING_HEADER: "WiFiTool/Sources/WiFiTool-Bridging-Header.h"
