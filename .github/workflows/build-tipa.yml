name: Build TrollStore TIPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Install Dependencies
      run: |
        brew install ldid xcodegen

    - name: Generate Xcode Project
      run: |
        xcodegen generate

    - name: Download Prebuilt ARM64 Tools & Wordlists
      run: |
        # 生成内置常用弱口令字典
        cat << 'EOF' > password.txt
        12345678
        88888888
        123456789
        11111111
        00000000
        1234567890
        87654321
        66666666
        admin123
        password
        123456
        1234567
        12345678
        password1
        iloveyou
        abc123
        123456a
        000000
        123123
        654321
        666666
        888888
        111111
        0000
        1234
        admin
        root
        test
        guest
        user
        wifi
        12345
        qwerty
        letmein
        welcome
        monkey
        dragon
        master
        login
        passw0rd
        p@ssw0rd
        1q2w3e4r
        1qaz2wsx
        qazwsx
        zaq12wsx
        pass1234
        admin@123
        root1234
        changeme
        default
        EOF

    - name: Build Xcode Project
      run: |
        xcodebuild clean build \
          -project WiFiTool.xcodeproj \
          -scheme WiFiTool \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          DEVELOPMENT_TEAM="" \
          PRODUCT_BUNDLE_IDENTIFIER=com.wifitool.app

    - name: Package TIPA with Resources
      run: |
        mkdir -p build_output/Payload
        cp -R build/Build/Products/Release-iphoneos/WiFiTool.app build_output/Payload/

        # 将字典拷贝进 App 内部
        cp password.txt build_output/Payload/WiFiTool.app/

        # 将 aircrack-ng 拷贝进 App（如仓库有提供则嵌入，否则跳过）
        if [ -f WiFiTool/Resources/aircrack-ng ]; then
          cp WiFiTool/Resources/aircrack-ng build_output/Payload/WiFiTool.app/
          chmod +x build_output/Payload/WiFiTool.app/aircrack-ng
          ldid -S build_output/Payload/WiFiTool.app/aircrack-ng
        fi

        # 伪签名赋予 Entitlements
        ldid -SEntitlements.plist build_output/Payload/WiFiTool.app/WiFiTool

        # 打包为 .tipa
        cd build_output
        zip -r ../WiFiTool.tipa Payload
        cd ..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WiFiTool-TrollStore
        path: WiFiTool.tipa
