name: Build TrollStore TIPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Install Dependencies
      run: |
        brew install ldid xcodegen

    - name: Generate Xcode Project
      run: |
        xcodegen generate

    - name: Build Xcode Project
      run: |
        xcodebuild clean build \
          -project WiFiTool.xcodeproj \
          -scheme WiFiTool \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          DEVELOPMENT_TEAM="" \
          PRODUCT_BUNDLE_IDENTIFIER=com.wifitool.app

    - name: Package TIPA
      run: |
        mkdir -p build_output/Payload
        cp -R build/Build/Products/Release-iphoneos/WiFiTool.app build_output/Payload/
        
        # 伪签名赋予 Entitlements
        ldid -SEntitlements.plist build_output/Payload/WiFiTool.app/WiFiTool
        if [ -f build_output/Payload/WiFiTool.app/aircrack-ng ]; then
          ldid -S build_output/Payload/WiFiTool.app/aircrack-ng
        fi

        # 打包为 .tipa
        cd build_output
        zip -r ../WiFiTool.tipa Payload
        cd ..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WiFiTool-TrollStore
        path: WiFiTool.tipa
