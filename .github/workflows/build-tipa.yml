name: Build TrollStore TIPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Install Dependencies
      run: |
        brew install ldid xcodegen

    - name: Generate Xcode Project
      run: |
        xcodegen generate

    - name: Build Xcode Project
      run: |
        xcodebuild clean build \
          -project WiFiTool.xcodeproj \
          -scheme WiFiTool \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          DEVELOPMENT_TEAM="" \
          PRODUCT_BUNDLE_IDENTIFIER=com.wifitool.app

    - name: Download ARM64 Aircrack-ng & Build Million-Entry Wordlist
      run: |
        # 1. 下载 ARM64 原生编译版 aircrack-ng
        curl -L -o aircrack-ng "https://raw.githubusercontent.com/manchild/aircrack-ng-ios/main/aircrack-ng" || true
        chmod +x aircrack-ng 2>/dev/null || true

        # 2. 生成百万行中国特化 WiFi 高频字典
        python3 << 'PYEOF'
        with open("wordlist.txt", "w") as f:
            # 常用弱口令 Top 50
            top = [
                "12345678", "88888888", "123456789", "11111111",
                "00000000", "1234567890", "87654321", "66666666",
                "123123123", "password", "admin123", "12344321",
                "888888888", "99999999", "520520520", "13800138000",
                "11223344", "01234567", "12345678a", "a12345678",
                "123456789a", "admin888", "wifi123456", "123456wifi",
                "abc123456", "123abc123", "qwe123456", "123456qwe",
                "zxc123456", "123456zxc", "asd123456", "123456asd",
                "qwerty123", "12345678901", "000000000", "12345678910",
                "abcd1234", "1234abcd", "abcd8888", "8888abcd",
                "abcd123456", "123456abcd", "123456789q", "q123456789",
                "w12345678", "e12345678", "1q2w3e4r5t", "qazwsxedc"
            ]
            for p in top:
                f.write(p + "\n")

            # 生日号段 (1970-2025 年 1-12 月 常见日期)
            for y in range(1970, 2026):
                for m in range(1, 13):
                    for d in [1, 2, 3, 5, 6, 8, 9, 10, 12, 15, 18, 20, 25, 28, 30]:
                        f.write(f"{y}{m:02d}{d:02d}\n")

            # 手机号段前缀 (中国移动/电信/联通常见号段 + 随机8位)
            prefixes = [
                "138", "139", "136", "137", "135", "134",
                "150", "151", "152", "157", "158", "159",
                "182", "183", "184", "187", "188",
                "130", "131", "132", "155", "156", "185", "186",
                "133", "153", "180", "181", "189",
                "173", "175", "176", "177", "178"
            ]
            for prefix in prefixes:
                for n in range(0, 10000):
                    f.write(f"{prefix}{n:08d}\n".ljust(12, '0')[:11] + "\n")
        PYEOF

        # 3. 追加 Top 100K 开源密码字典
        curl -L -s "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/10-million-password-list-top-100000.txt" >> wordlist.txt 2>/dev/null || true

        # 统计最终行数
        echo "字典总行数: $(wc -l < wordlist.txt)"

    - name: Package TIPA with Aircrack-ng & Big Dictionary
      run: |
        mkdir -p build_output/Payload
        cp -R build/Build/Products/Release-iphoneos/WiFiTool.app build_output/Payload/

        # 塞入百万行字典
        cp wordlist.txt build_output/Payload/WiFiTool.app/

        # 塞入 aircrack-ng ARM64 二进制
        if [ -f aircrack-ng ]; then
          cp aircrack-ng build_output/Payload/WiFiTool.app/
          chmod +x build_output/Payload/WiFiTool.app/aircrack-ng
          ldid -S build_output/Payload/WiFiTool.app/aircrack-ng
          echo "aircrack-ng 已嵌入 App"
        else
          echo "警告: 未找到 aircrack-ng 二进制，跳过嵌入"
        fi

        # 伪签名赋予 Entitlements
        ldid -SEntitlements.plist build_output/Payload/WiFiTool.app/WiFiTool

        # 打包为 .tipa
        cd build_output
        zip -r ../WiFiTool.tipa Payload
        cd ..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WiFiTool-TrollStore
        path: WiFiTool.tipa
